  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reglamento Copropietarios</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
      display: flex;
      overflow: hidden;
    }
    .container {
      width: 100%;
      max-width: 420px;
      height: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    h1 {
      text-align: center;
      margin: 0;
      font-size: clamp(18px, 4vw, 28px);
      flex: 0 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }
    .message-wrap {
      position: relative;
      aspect-ratio: 9 / 16;
      height: 100%;
      width: auto;
      max-width: 100%;
      overflow: hidden;
      border-radius: 12px;
      flex: 1 1 auto;
      min-height: 0;
      background: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .message-wrap p {
      color: #fff;
      font-size: clamp(16px, 4.5vw, 22px);
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="container">
    <article class="card">
      <div class="message-wrap">
        <p>No está permitido la tenencia de perros en el edificio. Reglamento de Copropietarios</p>
      </div>
    </article>
  </main>
