<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video vertical</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      text-align: center;
      margin: 0 0 28px;
      font-size: 28px;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 {
      font-size: 20px;
      line-height: 1.35;
      margin: 0 0 16px;
      text-align: center;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      /* Formato vertical 9:16 -> padding-top = 16/9 * 100% */
      padding-top: 177.78%;
      overflow: hidden;
      border-radius: 12px;
    }
    .video-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    @media (max-width: 480px) {
      .container { max-width: 100%; padding: 20px 12px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Video</h1>
    <article class="card">
      <h2>Así se ve y escucha en otros departamentos</h2>
      <div class="video-wrap">
        <iframe src="https://player.vimeo.com/video/1215612105?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479"
          allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          title="video vertical"
          allowfullscreen></iframe>
      </div>
    </article>
  </main>
  <script src="https://player.vimeo.com/api/player.js"></script>
